# Runs the shared workflow policy of filiptrivan/ci-workflows over this repo's workflows (pacms-workspace#693).
# No job may run on `ubuntu-latest`.
# Each npm package that a job fetches at run time must name a version.
# Each setup-node step must read its Node version from the root `.nvmrc`.
#
# This workflow has no paths filter, because the check takes only seconds.
# Then it also finds a rule that ci-workflows' `main` adds later.
# It is not a required check of the ruleset.

name: Workflow policy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: workflow-policy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pins:
    name: Workflow policy
    # It skips afk/ and session/ pull requests (pacms-workspace#856), because their CI decides nothing.
    # The push to main runs this job on the merged tree.
    if: github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'afk/') || startsWith(github.head_ref, 'session/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ci-workflows' `main`, which a push sends before this repo's.
      - uses: actions/checkout@v4
        with:
          repository: filiptrivan/ci-workflows
          ref: main
          path: ci-workflows
          persist-credentials: false

      # This job uses the Node of the runner image and has no setup-node step.
      # The checker imports only the built-in modules of Node.
      - name: No job on ubuntu-latest, no unversioned npm package, Node from .nvmrc
        run: node ci-workflows/workflow-policy/pins.mjs --root .
