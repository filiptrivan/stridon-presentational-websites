name: Test

on:
  push:
    branches: [main]
  pull_request:
  # Fired by pa-cms's deploy-backend workflow after its identity gate passes, so the backend that
  # just reached production is checked against the calls these sites actually make. This is the
  # trigger that was missing on 2026-07-29: the integration job below already existed and already
  # asserted the right thing, but it only ran when THIS repo pushed — and a PACMS dependency bump
  # is not a push here. pa-cms treats a red result as a rollback signal.
  repository_dispatch:
    types: [pacms-backend-deployed]

jobs:
  # Lint ran nowhere in CI until 2026-08-04 — `next build` on Vercel was the only thing that ever
  # saw a lint error, and only at deploy time. The pre-push hook runs the same command locally, but
  # a hook is one `--no-verify` (or one un-installed clone) from silence, so the enforced copy lives
  # here. Parallel to `unit` on purpose: a lint error and a failed test are independent facts and
  # you want both in one run, not the second one hidden behind the first.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration:
    name: Integration tests
    needs: unit
    # Runs on a push to main (our change) and on a pa-cms deploy (their change). Skipped on PRs:
    # it writes real warranty registrations against a live backend, so it must not run on
    # fork-originated code, and PR runs would not have the secrets anyway.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ secrets.API_URL }}
      PACMS_API_KEY: ${{ secrets.PACMS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
