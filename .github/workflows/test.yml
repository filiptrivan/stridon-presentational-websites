name: Test

on:
  push:
    branches: [main]
  pull_request:
  # Fired by pa-cms's deploy-backend workflow after its identity gate passes, so the backend that
  # just reached production is checked against the calls these sites actually make. This is the
  # trigger that was missing on 2026-07-29: the integration job below already existed and already
  # asserted the right thing, but it only ran when THIS repo pushed — and a PACMS dependency bump
  # is not a push here. pa-cms reds its deploy run on a red result.
  #
  # NEVER add a `run-name:` to this workflow. pa-cms finds the run its dispatch created by
  # matching displayTitle against the event type (its consumer-contract.sh → "SELECT BY EVENT
  # TYPE"), and for a repository_dispatch run the displayTitle IS the event type — unless
  # run-name overrides it. Set one and every backend deploy over there reds as `unverified`.
  repository_dispatch:
    types: [pacms-backend-deployed]

jobs:
  # Why lint is gated here and not only in the pre-push hook: CLAUDE.md → Preflight. Parallel to
  # `unit` rather than folded into it, because `pnpm preflight` (turbo) halts on the first failing
  # task, and a lint error must not hide the test result.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` — the action reads `packageManager` from the root package.json,
      # so the pnpm pin lives in exactly one place (pa-storefront's gates do the same).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration:
    name: Integration tests
    needs: unit
    # Runs on a push to main (our change) and on a pa-cms deploy (their change). Skipped on PRs:
    # it writes real warranty registrations against a live backend, so it must not run on
    # fork-originated code, and PR runs would not have the secrets anyway.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ secrets.API_URL }}
      PACMS_API_KEY: ${{ secrets.PACMS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
