name: Test

on:
  push:
    branches: [main]
  pull_request:
  # Nightly smoke against the live backend — the drift window between our pushes and pa-cms's
  # deploys (a data-dependent break, an API-path infra change). A red run mails THIS repo's
  # maintainers, the right recipient by construction. The old repository_dispatch listener is
  # gone (2026-08-05): pa-cms's deploy now checks this repo out at main and runs the integration
  # suite ITSELF, synchronously, against its pre-promote candidate — a backend that breaks these
  # calls never serves, and no cross-repo run-polling (or its run-name prohibition) exists
  # anymore. 04:00 UTC, after pa-cms's nightly syncs settle.
  schedule:
    - cron: '0 4 * * *'

jobs:
  # Why lint is gated here and not only in the pre-push hook: CLAUDE.md → Preflight. Parallel to
  # `unit` rather than folded into it, because `pnpm preflight` (turbo) halts on the first failing
  # task, and a lint error must not hide the test result.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` — the action reads `packageManager` from the root package.json,
      # so the pnpm pin lives in exactly one place (pa-storefront's gates do the same).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration:
    name: Integration tests
    needs: unit
    # Runs on a push to main (our change) and on the nightly schedule (drift). Skipped on PRs:
    # it writes real warranty registrations against a live backend, so it must not run on
    # fork-originated code, and PR runs would not have the secrets anyway. pa-cms's deploy runs
    # this same suite itself against its candidate — see the trigger comment above.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ secrets.API_URL }}
      PACMS_API_KEY: ${{ secrets.PACMS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
