name: Claude Code (maintainer-triggered)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-bot-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # PUBLIC REPO SECURITY: only maintainers (write/admin) can trigger @claude, so an
    # external contributor cannot run the bot — which has your secrets + a write token —
    # on their own fork PR. Together with the read-and-comment-only tool scope below, the
    # bot can review untrusted code but has NO tool to exfiltrate secrets or push.
    # Do NOT relax the author_association gate or broaden the tools on a public repo.
    if: >-
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: Run Claude Code (review + comment only)
        uses: anthropics/claude-code-action@d5726de019ec4498aa667642bc3a80fca83aa102 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # SECURITY (public repo): no general Bash, no Write/Edit, no Read of checked-out
          # files, no build/run of PR code. Claude can only read the PR diff and post
          # comments — so even a prompt-injected fork diff has no tool to leak the token or
          # push. This makes the bot review-only (it cannot apply code changes), which is
          # the intended use here: sanity-reviewing external PRs before you bypass-merge.
          claude_args: '--allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
